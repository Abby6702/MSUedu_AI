{% macro avatar(user_id, name, has_photo, size='') %}
{% if has_photo %}
<img class="avatar {{ size }}" src="{{ url_for('people.photo', tutor_id=user_id) }}" alt="Photo of {{ name }}" loading="lazy">
{% else %}
{% set parts = name.split() %}
<span class="avatar {{ size }}" aria-hidden="true">{{ (parts[0][0] ~ (parts[-1][0] if parts|length > 1 else ''))|upper }}</span>
{% endif %}
{% endmacro %}
